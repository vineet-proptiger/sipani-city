<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0d0d0d;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .error-card {
      text-align: center;
      max-width: 440px;
      padding: 40px 30px;
    }
    .error-code {
      font-size: 72px;
      font-weight: 800;
      letter-spacing: -2px;
      color: #e5e7eb;
      margin-bottom: 8px;
      line-height: 1;
    }
    .error-title {
      font-size: 20px;
      font-weight: 600;
      color: #9ca3af;
      margin-bottom: 12px;
    }
    .error-desc {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">404</div>
    <div class="error-title">Page Not Found</div>
    <p class="error-desc">The page you are looking for does not exist or has been moved.</p>
  </div>
</body>
</html>
